<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1f24" />
    <title>Gabi's Photo Gallerie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <!-- Password gate -->
    <section id="gate" class="gate" aria-labelledby="gate-title">
      <div class="gate__panel">
        <p class="gate__brand">Gabi's Photo Gallerie</p>
        <h1 id="gate-title" class="gate__title">Passwort eingeben</h1>
        <p class="gate__hint">Gib das korrekte Passwort ein, um die Galerie zu öffnen.</p>
        <form id="gate-form" class="gate__form" autocomplete="off">
          <label class="visually-hidden" for="password-input">Passwort</label>
          <div class="gate__field">
            <input
              id="password-input"
              class="gate__input"
              type="password"
              name="password"
              placeholder="Passwort"
              required
              autofocus
              enterkeyhint="go"
            />
            <button
              type="button"
              id="password-toggle"
              class="gate__toggle"
              aria-label="Show password"
              aria-controls="password-input"
              aria-pressed="false"
            >
              <svg class="gate__toggle-icon gate__toggle-icon--show" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                />
              </svg>
              <svg class="gate__toggle-icon gate__toggle-icon--hide" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden>
                <path
                  fill="currentColor"
                  d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"
                />
              </svg>
            </button>
          </div>
          <button type="submit" class="gate__submit">Galerie öffnen</button>
          <p id="gate-error" class="gate__error" role="alert" hidden>
            Incorrect password. Try again.
          </p>
        </form>
      </div>
    </section>

    <!-- Gallery (shown after unlock) -->
    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__title">Gabi's Photo Gallerie</span>
        </div>
        <button
          type="button"
          id="refresh-btn"
          class="topbar__refresh"
          aria-label="Refresh photos"
        >
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7c2.76 0 5 2.24 5 5a5 5 0 0 1-8.9 3.1L6.7 16.5A7 7 0 0 0 19 12c0-1.93-.78-3.68-2.05-4.95zM6 12c0-1.48.52-2.84 1.38-3.9L8.7 6.7A6.97 6.97 0 0 0 5 12a7 7 0 0 0 11.3 5.5l-1.4-1.4A5 5 0 0 1 6 12z"
            />
          </svg>
          <span class="topbar__refresh-label">Refresh</span>
        </button>
      </header>

      <main class="main">
        <div
          id="tag-filters"
          class="tag-filters"
          role="toolbar"
          aria-label="Filter by tag"
          hidden
        ></div>
        <div id="status" class="status" role="status" aria-live="polite">
          Photos werden geladen…
        </div>
        <div id="gallery" class="gallery"></div>
      </main>

      <footer class="footer">
        <a
          id="repo-link"
          class="footer__link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          >View on GitHub</a
        >
      </footer>
    </div>

    <!-- Lightbox -->
    <div
      id="lightbox"
      class="lightbox"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Photo viewer"
    >
      <button type="button" id="lightbox-close" class="lightbox__close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M18.3 5.71 12 12.01l-6.3-6.3-1.4 1.42 6.29 6.3-6.3 6.29 1.42 1.4 6.3-6.29 6.29 6.3 1.4-1.42-6.29-6.3 6.3-6.29z"
          />
        </svg>
      </button>
      <button type="button" id="lightbox-prev" class="lightbox__nav lightbox__nav--prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
        </svg>
      </button>
      <button type="button" id="lightbox-next" class="lightbox__nav lightbox__nav--next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
        </svg>
      </button>
      <div class="lightbox__stage">
        <img id="lightbox-image" class="lightbox__image" alt="" />
        <video
          id="lightbox-video"
          class="lightbox__video"
          controls
          playsinline
          preload="metadata"
          hidden
        ></video>
        <iframe
          id="lightbox-embed"
          class="lightbox__embed"
          title="Video"
          allow="autoplay; encrypted-media"
          allowfullscreen
          hidden
        ></iframe>
        <div class="lightbox__meta">
          <p id="lightbox-caption" class="lightbox__caption"></p>
          <div id="lightbox-tags" class="lightbox__tags"></div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
